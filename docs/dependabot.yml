# À déplacer dans .github/dependabot.yml : GitHub proposera chaque semaine des mises à jour de sécurité
# des dépendances (npm, pip, images Docker, GitHub Actions) sous forme de pull requests à relire.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories: [/backend, /frontend, /backup]
    schedule: {interval: monthly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
