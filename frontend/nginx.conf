server {
  # Image nginx « unprivileged » : pas de root, donc port 8080 dans le conteneur.
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # --- En-têtes de sécurité (s'appliquent à toutes les réponses) ---
  # CSP : uniquement les fichiers de l'appli elle-même ; pas de script en ligne, pas d'iframe, pas d'appel ailleurs.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://enablebanking.com https://*.enablebanking.com; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # HSTS : ignoré en HTTP (localhost), actif via https://…ts.net
  add_header Strict-Transport-Security "max-age=31536000" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Imports limités à 10 Mo côté API (+ marge pour l'enveloppe multipart).
    client_max_body_size 11m;
    proxy_read_timeout 120s;
  }

  # Application monopage : toutes les autres routes renvoient index.html.
  location / {
    try_files $uri /index.html;
  }
}
